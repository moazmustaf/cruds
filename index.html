<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUDS</title>
    <link rel="stylesheet" href="INDEX.CSS">
</head>
<body>

    <div class="crud">
        <div class="head">
            <h2>CRUDS</h2>
            <p>PRODUCT MANAGEMET SYSTEM</p>
        </div>
        <div class="inputs">
            <input placeholder="title" type="text" id="title">
            <div class="price">
                <input onkeyup="getotal()" placeholder="price" type="number" id="price">
                <input onkeyup="getotal()" placeholder="taxes" type="number" id="taxes">
                <input onkeyup="getotal()" placeholder="ads" type="number" id="ads">
                <input onkeyup="getotal()" placeholder="discount" type="number" id="discount">
                <small id="total"></small>
            </div>
            <input placeholder="count" type="number" id="count">
            <input placeholder="catogry" type="text" id="catogry">
            <button id="submit">create</button>

        </div>
        <div class="output">
            <div class="searchBlock">
                <input  onkeyup="searchData(this.value)" type="text" id="search" placeholder="search">
                <div class="btnshearch">
                    <button onclick="getsearchmood(this.id)" id="searchtitle">search by title</button>
                    <button onclick="getsearchmood(this.id)" id="searchcatogry">search by catogry</button>
                </div>
            </div>

<table>
    <tr> 
        <th>id</th>
        <th>title</th>
        <th>price</th>
        <th>taxes</th>
        <th>ads</th>
        <th>discount</th>
        <th>total</th>
        <th>catogrt  </th>
        <th>Update</th>
        <th>delete</th>
    </tr>
    <tbody id="tbody">
      <div id="deleteAll">

      </div>
    </tbody>
</table>


        </div>
    </div>

 
    
    <script src="index.js"></script>
</body>
</html>
